<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassVisionAI - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════════════════════════════
       ClassVisionAI — Academic Observatory Login Design
       ═══════════════════════════════════════════════════════════ */
    
    :root {
      --login-bg: #080F1E;
      --login-surface: rgba(255,255,255,0.06);
      --login-border: rgba(255,255,255,0.10);
      --login-blue: #2563EB;
      --login-blue-glow: rgba(37,99,235,0.35);
      --login-teal: #0D9488;
      --login-text: #F0F6FF;
      --login-muted: rgba(240,246,255,0.50);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--login-bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      color: var(--login-text);
    }
    
    /* ─── Animated Constellation Grid Background ─────────────────────────── */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    
    /* ─── Floating Metric Badges ─────────────────────────────────────────── */
    .floating-badge {
      position: fixed;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 0.75rem;
      color: rgba(240,246,255,0.40);
      pointer-events: none;
      z-index: 1;
    }
    
    .badge-1 {
      left: 15%;
      top: 25%;
      animation: floatA 6s ease-in-out infinite;
    }
    
    .badge-2 {
      left: 78%;
      top: 68%;
      animation: floatB 8s ease-in-out infinite;
      animation-delay: 2s;
    }
    
    .badge-3 {
      left: 75%;
      top: 20%;
      animation: floatC 7s ease-in-out infinite;
      animation-delay: 1s;
    }
    
    @keyframes floatA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    
    @keyframes floatB {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    
    @keyframes floatC {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    
    /* ─── System Clock ────────────────────────────────────────────────────── */
    .system-clock {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 10;
      text-align: right;
    }
    
    .clock-time {
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      color: rgba(240,246,255,0.35);
      margin-bottom: 2px;
    }
    
    .clock-date {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: rgba(240,246,255,0.2);
    }
    
    /* ─── Login Card ──────────────────────────────────────────────────────── */
    .login-card {
      width: 420px;
      background: var(--login-surface);
      backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--login-border);
      border-radius: 20px;
      box-shadow: 
        0 0 0 1px rgba(37,99,235,0.1),
        0 24px 64px rgba(0,0,0,0.5),
        0 0 80px rgba(37,99,235,0.08);
      padding: 44px 40px 40px;
      position: relative;
      z-index: 5;
      animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    
    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    
    /* ─── Logo Section ────────────────────────────────────────────────────── */
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }
    
    .logo-mark {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #1E3A6E, #2563EB);
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(37,99,235,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      margin-bottom: 16px;
    }
    
    .logo-mark svg {
      width: 28px;
      height: 28px;
      color: white;
      position: relative;
      z-index: 2;
    }
    
    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      height: 2px;
      background: rgba(0,220,255,0.8);
      width: 0;
      animation: scanLine 2.5s ease-in-out infinite;
    }
    
    @keyframes scanLine {
      0% { width: 0%; opacity: 0; left: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { width: 100%; opacity: 0; left: 0; }
    }
    
    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--login-text);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    
    .brand-subtitle {
      font-size: 0.78rem;
      color: rgba(240,246,255,0.45);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      margin: 24px 0 28px;
    }
    
    /* ─── Form Section ────────────────────────────────────────────────────── */
    .form-header {
      margin-bottom: 28px;
    }
    
    .form-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--login-text);
      margin-bottom: 6px;
    }
    
    .form-subtitle {
      font-size: 0.82rem;
      color: rgba(240,246,255,0.45);
    }
    
    .form-group {
      margin-bottom: 18px;
    }
    
    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: rgba(240,246,255,0.55);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    
    .input-wrapper {
      position: relative;
    }
    
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: rgba(240,246,255,0.25);
      transition: color 0.2s;
      pointer-events: none;
    }
    
    .form-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 10px;
      color: var(--login-text);
      font-size: 0.9rem;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: all 0.2s ease;
    }

    
    .form-input::placeholder {
      color: rgba(240,246,255,0.20);
    }
    
    .form-input:focus {
      border-color: rgba(37,99,235,0.6);
      background: rgba(37,99,235,0.08);
      box-shadow: 
        0 0 0 3px rgba(37,99,235,0.15),
        0 0 20px rgba(37,99,235,0.1);
    }
    
    .form-input:focus + .input-icon {
      color: rgba(37,99,235,0.9);
    }
    
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(240,246,255,0.25);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    
    .toggle-password:hover {
      color: rgba(37,99,235,0.9);
    }
    
    .toggle-password svg {
      width: 18px;
      height: 18px;
    }
    
    /* ─── Form Options ────────────────────────────────────────────────────── */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      margin-bottom: 32px;
    }
    
    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    
    .custom-checkbox {
      width: 16px;
      height: 16px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    
    .checkbox-wrapper input[type="checkbox"] {
      display: none;
    }
    
    .checkbox-wrapper input[type="checkbox"]:checked + .custom-checkbox {
      background: var(--login-blue);
      border-color: var(--login-blue);
    }
    
    .custom-checkbox svg {
      width: 12px;
      height: 12px;
      color: white;
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    .checkbox-wrapper input[type="checkbox"]:checked + .custom-checkbox svg {
      opacity: 1;
    }
    
    .checkbox-label {
      font-size: 0.8rem;
      color: rgba(240,246,255,0.5);
    }
    
    .forgot-link {
      font-size: 0.8rem;
      color: #60A5FA;
      text-decoration: none;
      transition: color 0.2s;
    }
    
    .forgot-link:hover {
      color: white;
    }
    
    /* ─── Submit Button ───────────────────────────────────────────────────── */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #1D4ED8, #2563EB);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 0.92rem;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 0.02em;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(37,99,235,0.4);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    
    .btn-submit::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: skewX(-20deg);
    }
    
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(37,99,235,0.5);
      background: linear-gradient(135deg, #2563EB, #3B82F6);
    }
    
    .btn-submit:hover::before {
      animation: shimmer 0.6s ease;
    }
    
    @keyframes shimmer {
      from { left: -100%; }
      to { left: 150%; }
    }
    
    .btn-submit:active {
      transform: translateY(0);
    }
    
    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    
    .btn-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .btn-submit.loading .btn-spinner {
      display: block;
    }
    
    .btn-submit.loading .btn-text {
      display: none;
    }

    
    /* ─── Error Message ───────────────────────────────────────────────────── */
    .error-message {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 8px;
      padding: 10px 14px;
      color: #FCA5A5;
      font-size: 0.82rem;
      margin-top: 16px;
      display: none;
      align-items: center;
      gap: 8px;
      animation: slideDown 0.2s ease;
    }
    
    .error-message.show {
      display: flex;
    }
    
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .error-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    
    /* ─── Footer ──────────────────────────────────────────────────────────── */
    .page-footer {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: rgba(240,246,255,0.18);
      letter-spacing: 0.04em;
      z-index: 10;
      text-align: center;
    }
    
    /* ─── Responsive ──────────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .login-card {
        width: 92vw;
        padding: 32px 24px;
      }
      
      .floating-badge {
        display: none;
      }
      
      .system-clock {
        top: 12px;
        right: 12px;
      }
      
      .clock-time {
        font-size: 0.75rem;
      }
      
      .clock-date {
        font-size: 0.62rem;
      }
    }
  </style>
</head>

<body>
  <!-- Animated Constellation Grid Background -->
  <canvas id="bgCanvas"></canvas>
  
  <!-- Floating Metric Badges -->
  <div class="floating-badge badge-1">⚡ Real-time AI</div>
  <div class="floating-badge badge-2">🎯 98% Accuracy</div>
  <div class="floating-badge badge-3">🔒 Privacy First</div>
  
  <!-- System Clock -->
  <div class="system-clock">
    <div class="clock-time" id="clockTime">00:00:00</div>
    <div class="clock-date" id="clockDate">Loading...</div>
  </div>
  
  <!-- Login Card -->
  <div class="login-card">
    <!-- Logo Section -->
    <div class="logo-container">
      <div class="logo-mark">
        <div class="scan-line"></div>
        <svg viewBox="0 0 28 28" fill="none">
          <rect x="2" y="6" width="24" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M9 10 L14 15 L19 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="9" cy="10" r="2" fill="currentColor"/>
          <circle cx="19" cy="10" r="2" fill="currentColor"/>
          <circle cx="14" cy="19" r="1.5" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand-title">ClassVisionAI</div>
      <div class="brand-subtitle">Smart Classroom Intelligence</div>
    </div>
    
    <div class="divider"></div>
    
    <!-- Form Section -->
    <div class="form-header">
      <div class="form-title">Welcome Back</div>
      <div class="form-subtitle">Sign in to your dashboard</div>
    </div>
    
    <form id="loginForm" onsubmit="handleLogin(event)">
      <!-- Username Field -->
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="username" 
            class="form-input" 
            placeholder="Enter your username" 
            required 
            autocomplete="username"
          />
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>

      
      <!-- Password Field -->
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="Enter your password" 
            required 
            autocomplete="current-password"
          />
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <button type="button" class="toggle-password" onclick="togglePassword()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      
      <!-- Form Options -->
      <div class="form-options">
        <label class="checkbox-wrapper">
          <input type="checkbox" id="remember" />
          <div class="custom-checkbox">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <span class="checkbox-label">Remember me</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>
      
      <!-- Submit Button -->
      <button type="submit" class="btn-submit" id="submitBtn">
        <div class="btn-spinner"></div>
        <span class="btn-text">Sign In</span>
      </button>
      
      <!-- Error Message -->
      <div class="error-message" id="errorMessage">
        <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <span id="errorText">Invalid credentials</span>
      </div>
    </form>
  </div>
  
  <!-- Footer -->
  <div class="page-footer">
    © 2026 ClassVisionAI. Built for educators, powered by AI.
  </div>

  
  <script>
    /* ═══════════════════════════════════════════════════════════
       Animated Constellation Grid
       ═══════════════════════════════════════════════════════════ */
    
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let dots = [];
    let animationId;
    let isVisible = true;
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initDots();
    }
    
    function initDots() {
      dots = [];
      for (let i = 0; i < 80; i++) {
        dots.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          radius: 1.5,
          pulseRadius: 1.5,
          isPulsing: false,
          pulseProgress: 0
        });
      }
    }
    
    function drawDots() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Update and draw dots
      dots.forEach(dot => {
        // Move dot
        dot.x += dot.vx;
        dot.y += dot.vy;
        
        // Bounce off edges
        if (dot.x < 0 || dot.x > canvas.width) dot.vx *= -1;
        if (dot.y < 0 || dot.y > canvas.height) dot.vy *= -1;
        
        // Handle pulsing
        if (dot.isPulsing) {
          dot.pulseProgress += 0.02;
          if (dot.pulseProgress >= 1) {
            dot.isPulsing = false;
            dot.pulseProgress = 0;
            dot.pulseRadius = 1.5;
          } else {
            // Pulse from 1.5 to 5 and back
            const t = dot.pulseProgress;
            const easeInOut = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            dot.pulseRadius = 1.5 + (3.5 * Math.sin(easeInOut * Math.PI));
          }
        }
        
        // Draw dot
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dot.pulseRadius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(37,99,235,0.6)';
        ctx.fill();
        
        // Draw glow ring if pulsing
        if (dot.isPulsing && dot.pulseRadius > 2) {
          ctx.beginPath();
          ctx.arc(dot.x, dot.y, dot.pulseRadius + 3, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(37,99,235,${0.3 * (1 - dot.pulseProgress)})`;
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      });

      
      // Draw connections
      for (let i = 0; i < dots.length; i++) {
        for (let j = i + 1; j < dots.length; j++) {
          const dx = dots[i].x - dots[j].x;
          const dy = dots[i].y - dots[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          
          if (distance < 140) {
            const opacity = (1 - distance / 140) * 0.15;
            ctx.beginPath();
            ctx.moveTo(dots[i].x, dots[i].y);
            ctx.lineTo(dots[j].x, dots[j].y);
            ctx.strokeStyle = `rgba(37,99,235,${opacity})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
      
      if (isVisible) {
        animationId = requestAnimationFrame(drawDots);
      }
    }
    
    // Random pulse trigger
    setInterval(() => {
      if (isVisible && dots.length > 0) {
        const randomDot = dots[Math.floor(Math.random() * dots.length)];
        if (!randomDot.isPulsing) {
          randomDot.isPulsing = true;
          randomDot.pulseProgress = 0;
        }
      }
    }, 4000);
    
    // Visibility change handler
    document.addEventListener('visibilitychange', () => {
      isVisible = !document.hidden;
      if (isVisible) {
        drawDots();
      } else {
        cancelAnimationFrame(animationId);
      }
    });
    
    // Initialize
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawDots();
    
    /* ═══════════════════════════════════════════════════════════
       System Clock
       ═══════════════════════════════════════════════════════════ */
    
    function updateClock() {
      const now = new Date();
      
      // Time
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clockTime').textContent = `${hours}:${minutes}:${seconds}`;
      
      // Date
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const dayName = days[now.getDay()];
      const day = now.getDate();
      const month = months[now.getMonth()];
      const year = now.getFullYear();
      document.getElementById('clockDate').textContent = `${dayName}, ${day} ${month} ${year}`;
    }
    
    updateClock();
    setInterval(updateClock, 1000);

    
    /* ═══════════════════════════════════════════════════════════
       Authentication Logic (preserved from original)
       ═══════════════════════════════════════════════════════════ */
    
    // Toggle password visibility
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
    }
    
    // Handle login form submission
    function handleLogin(event) {
      event.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      const submitBtn = document.getElementById('submitBtn');
      const errorMessage = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      
      // Hide previous errors
      errorMessage.classList.remove('show');
      
      // Show loading state
      submitBtn.classList.add('loading');
      submitBtn.disabled = true;
      
      // Simulate authentication delay
      setTimeout(() => {
        // Simple demo authentication (no backend for now)
        if (username === 'teacher' && password === 'demo123') {
          // Store session
          if (remember) {
            localStorage.setItem('classvision_user', username);
          } else {
            sessionStorage.setItem('classvision_user', username);
          }
          
          // Redirect to main app
          window.location.href = '/app';
        } else {
          // Show error
          errorText.textContent = 'Invalid credentials. Try: teacher / demo123';
          errorMessage.classList.add('show');
          
          // Reset button
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;
        }
      }, 800);
    }
    
    // Check if already logged in
    window.addEventListener('DOMContentLoaded', () => {
      const user = localStorage.getItem('classvision_user') || sessionStorage.getItem('classvision_user');
      if (user) {
        window.location.href = '/app';
      }
    });
  </script>
</body>
</html>
